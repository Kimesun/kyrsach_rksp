name: CI - Проверка качества кода

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ========== ПРОВЕРКА БЭКЕНДА ==========
  backend-checks:
    runs-on: ubuntu-latest
    name: 🔧 Backend проверка
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 📦 Install backend dependencies
        run: |
          cd backend
          npm install
      
      - name: ✅ Check package.json validity
        run: |
          cd backend
          node -e "require('./package.json')"
          echo "✅ Backend package.json is valid"
      
      - name: 🔍 Check for syntax errors
        run: |
          cd backend
          node -c src/server.js || true
          echo "✅ Syntax check completed"

  # ========== ФАЗЗИНГ-ТЕСТИРОВАНИЕ ==========
  fuzzing-tests:
    runs-on: ubuntu-latest
    name: 🧪 Фаззинг-тестирование API
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 📦 Install backend dependencies
        run: |
          cd backend
          npm install
      
      - name: 📦 Install fuzzing dependencies
        run: |
          cd fuzzing
          npm install
      
      - name: 🚀 Start backend server
        run: |
          cd backend
          npm start &
          sleep 5
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: psychologist_db_test
          JWT_SECRET: test_secret_key
          PORT: 5000
      
      - name: 🧪 Run fuzzing tests
        run: |
          cd fuzzing
          npm run fuzz
        continue-on-error: false

  # ========== СБОРКА ФРОНТЕНДА ==========
  frontend-build:
    runs-on: ubuntu-latest
    name: 🎨 Frontend сборка
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 📦 Install frontend dependencies
        run: |
          cd frontend
          npm install
      
      - name: 🔨 Build frontend
        run: |
          cd frontend
          npm run build
      
      - name: 📁 Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  # ========== ПРОВЕРКА DOCKER ==========
  docker-checks:
    runs-on: ubuntu-latest
    name: 🐳 Docker проверка
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: ✅ Check Docker Compose syntax
        run: |
          docker-compose -f docker-compose.yml config
          echo "✅ Docker Compose config is valid"
      
      - name: 📝 Check Dockerfiles exist
        run: |
          test -f backend/Dockerfile && echo "✅ backend/Dockerfile exists"
          test -f frontend/Dockerfile && echo "✅ frontend/Dockerfile exists"

  # ========== ПРОВЕРКА СТРУКТУРЫ ==========
  structure-checks:
    runs-on: ubuntu-latest
    name: 📁 Проверка структуры проекта
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: ✅ Check required files exist
        run: |
          # Проверка наличия обязательных файлов
          test -f README.md && echo "✅ README.md exists"
          test -f .gitignore && echo "✅ .gitignore exists"
          test -f docker-compose.yml && echo "✅ docker-compose.yml exists"
          test -d backend/src && echo "✅ backend/src exists"
          test -d frontend/src && echo "✅ frontend/src exists"
          test -f backend/package.json && echo "✅ backend/package.json exists"
          test -f frontend/package.json && echo "✅ frontend/package.json exists"
      
      - name: 📊 Project structure summary
        run: |
          echo "📁 Структура проекта:"
          ls -la
          echo ""
          echo "📁 Backend:"
          ls -la backend/
          echo ""
          echo "📁 Frontend:"
          ls -la frontend/

  # ========== ФИНАЛЬНЫЙ СТАТУС ==========
  final-status:
    runs-on: ubuntu-latest
    needs: [backend-checks, fuzzing-tests, frontend-build, docker-checks, structure-checks]
    name: ✅ Финальный статус
    
    steps:
      - name: 🎉 All checks passed
        run: |
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║                                                          ║"
          echo "║   ✅  Все проверки пройдены успешно!                     ║"
          echo "║                                                          ║"
          echo "║   📦 Backend проверка:      ✅                           ║"
          echo "║   🧪 Фаззинг-тесты:         ✅                           ║"
          echo "║   🎨 Frontend сборка:       ✅                           ║"
          echo "║   🐳 Docker проверка:       ✅                           ║"
          echo "║   📁 Структура проекта:     ✅                           ║"
          echo "║                                                          ║"
          echo "╚══════════════════════════════════════════════════════════╝"